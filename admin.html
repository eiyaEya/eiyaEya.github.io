<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ff2442" />
    <title>后台维护 | Sang Ruiquan</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="admin-shell">
      <header class="admin-header">
        <div>
          <h1>后台维护</h1>
          <p class="admin-status" id="status">读取 data/site.json</p>
        </div>
        <a class="secondary-button" href="index.html#home">回首页</a>
      </header>

      <section class="admin-grid">
        <article class="admin-panel">
          <h2>快速录入</h2>
          <div class="field-grid">
            <label>
              姓名
              <input id="profileName" type="text" />
            </label>
            <label>
              简介
              <input id="profileBio" type="text" />
            </label>
            <label>
              邮箱
              <input id="contactEmail" type="email" />
            </label>
            <label>
              GitHub
              <input id="contactGithub" type="url" />
            </label>
            <label>
              新随笔标题
              <input id="newBlogTitle" type="text" placeholder="输入标题后可追加到 Blog" />
            </label>
            <label>
              新随笔摘要
              <textarea id="newBlogExcerpt" class="compact-textarea" spellcheck="false"></textarea>
            </label>
          </div>
          <div class="action-row">
            <button class="primary-button" id="applyQuickBtn" type="button">应用资料</button>
            <button class="secondary-button" id="addBlogBtn" type="button">新增随笔</button>
          </div>
        </article>

        <article class="admin-panel">
          <h2>数据源</h2>
          <div class="field-grid">
            <label>
              GitHub Token
              <input id="token" autocomplete="off" type="password" placeholder="仅在本浏览器本次发布使用" />
            </label>
            <label>
              JSON 数据
              <textarea id="jsonEditor" spellcheck="false"></textarea>
            </label>
          </div>
          <div class="action-row">
            <button class="primary-button" id="publishBtn" type="button">保存到 GitHub</button>
            <button class="secondary-button" id="downloadBtn" type="button">下载 JSON</button>
            <a class="ghost-button" id="githubEditLink" href="#" target="_blank" rel="noreferrer">在线编辑</a>
          </div>
        </article>

        <article class="admin-panel">
          <h2>录入检查</h2>
          <p class="admin-status" id="validateStatus">等待数据加载</p>
          <div class="action-row">
            <button class="secondary-button" id="formatBtn" type="button">格式化</button>
            <button class="ghost-button" id="previewBtn" type="button">打开预览</button>
          </div>
        </article>
      </section>
    </main>

    <script src="admin.js" type="module"></script>
  </body>
</html>
